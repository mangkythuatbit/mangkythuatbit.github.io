<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang chủ Đoàn - Hội khoa Công nghệ thông tin kinh doanh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
@import url('./assets/css/File_CSS_chung.css');
/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    font-family: Roboto, sans-serif;
  }
  
  /* NAVBAR CHUNG */
  .navbar {
    position: fixed;
    top: 0;         /* Ghim navbar lên đầu trang */
    left: 0;        /* Canh trái trang */
    width: 100%;    /* Trải rộng 100% chiều ngang */
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background-color: white;
    box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
    z-index: 999;
  }
  
  /* LOGO */
  .logo {
    font-size: 24px;
    font-weight: bold;
    display: flex;
    align-items: center;
    padding: 10px 20px;
  }
  .logo img {
    height: 30px;
    margin-right: 10px;
  }
  
  /* NAV-LINKS (MENU) */
  .nav-links {
    display: flex;
    list-style: none;
    position: relative;
    justify-content: center; /* Căn giữa các phần tử theo chiều ngang */
    align-items: center;     /* Căn giữa các phần tử theo chiều dọc */
    width: 100%;             /* Đảm bảo thanh chứa chiếm đầy chiều ngang */
  }
  
  .nav-links li {
    margin: 0 15px;
    position: relative;
  }
  
/* Hiệu ứng hover nền đỏ chữ vàng cho nav-links - cả desktop và mobile */
.nav-links a {
  text-decoration: none;
  color: black;
  font-weight: bold;
  padding: 10px 20px;
  transition: all 0.3s ease-in-out;
  position: relative;
  z-index: 2;
  display: inline-block;
  border-radius: 5px;
}

/* Nền đỏ khi hover */
.nav-links a::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 100%;
  background: linear-gradient(to right, #6CA9C3 0%, #122CD4 47%, #3F6BCC 100%); /* Màu nền xanh gradient*/
  transition: all 0.3s ease-in-out;
  z-index: -1;
  border-radius: 5px;
}

/* Chữ vàng khi hover */
.nav-links a:hover {
  color: #f9f9f7; /* Màu chữ trắng */
}

/* Hiệu ứng mở rộng nền đỏ khi hover */
.nav-links a:hover::before {
  width: 100%;
}

/* Điều chỉnh cho mobile */
@media screen and (max-width: 768px) {
  /* Trên mobile, mở rộng chiều ngang của khu vực hover */
  .nav-links a {
    width: 100%;
    padding: 15px 25px;
    margin: 5px 0;
    text-align: left;
  }
  
  /* Giữ nguyên hiệu ứng hover như trên desktop */
  .nav-links a::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 100%;
    background-color: #ff0000;
    transition: all 0.3s ease-in-out;
    z-index: -1;
    border-radius: 5px;
  }
  
  .nav-links a:hover {
    color: #ffff00;
  }
  
  .nav-links a:hover::before {
    width: 100%;
  }
  
  /* Đảm bảo menu dropdown đóng đúng khi click */
  .nav-links.active a:hover::before {
    width: 100%;
  }
}
  /* INDICATOR (dùng cho hiệu ứng JS nếu cần) */
  .indicator {
    position: absolute;
    bottom: -5px;
    height: 4px;
    background: linear-gradient(to right, #4c83ee, #0026ff);
    width: 0;
    left: 0;
    transition: all 0.3s ease-in-out;
    border-radius: 2px;
  }
  
  /* USER SECTION */
  .user-section {
    display: flex;
    align-items: center;
    padding:10px 20px;
  }
  
  .user-section i {
    color: #ffff;
    font-size: 20px;
    margin-right: 10px;
  }
  
  .user-profile {
    background: linear-gradient(to right, #6CA9C3 0%, #122CD4 47%, #3F6BCC 100%);
    display: flex;
    align-items: center;
    color: #ffff;
    padding: 5px 10px;
    border-radius: 5px;
  }
  
  /* 🛎️ Biểu tượng chuông */
  .notification-icon {
    position: relative;
    cursor: pointer;
    margin-right: 20px;
  }
  
  .notification-icon img {
    width: 20px;
    height: auto;
    display: block;
    transition: transform 0.2s ease-in-out;
  }
  
  /* 🔔 Hiệu ứng hover */
  .notification-icon:hover img {
    transform: scale(1.1);
  }
  
  /* 📜 Popup thông báo */
  .notification-popup {
    display: none;
    position: absolute;
    top: 40px;
    right: -10px;
    width: 250px;
    background-color: white;
    box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2);
    border-radius: 8px;
    padding: 10px;
    z-index: 100;
  }
  
  .notification-popup h4 {
    font-size: 16px;
    margin-bottom: 10px;
    text-align: center;
  }
  
  .notification-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  
  .notification-list li {
    font-size: 14px;
    padding: 8px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
  }
  
  .notification-list li:hover { /*hiệu ứng hover cho caí chuông và mục thông báo */
    background-color: #f1f1f1;
  }
  
  /* Thêm animation cho popup khi hiển thị */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .notification-popup[style*="display: block"] {
    animation: fadeIn 0.3s ease-out;
  }


  /* Nút hamburger cho mobile */
  .hamburger {
    display: none;
    flex-direction: column;
    justify-content: space-between;
    width: 30px;
    height: 21px;
    cursor: pointer;
    z-index: 1001;
    margin-right: 15px;
  }
  
  .hamburger span {
    display: block;
    height: 3px;
    width: 100%;
    background-color: #333;
    border-radius: 3px;
    transition: all 0.3s ease-in-out;
  }

  /* Overlay cho mobile */
  .overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 998;
  }
  
  @media screen and (max-width: 768px) {
    .hamburger {
      display: flex;
    }
    
    .logo {
      padding: 10px 0;
      z-index: 1001;
    }
    
    /* Ẩn user section trên mobile hoặc điều chỉnh hiển thị */
    .user-section {
      padding: 5px 0;
      z-index: 1001;
    }
    
    .user-profile {
      font-size: 14px;
      padding: 4px 8px;
    }
    
    /* Điều chỉnh navbar cho mobile */
    .nav-links {
      position: fixed;
      top: 0;
      left: -100%;
      flex-direction: column;
      background-color: white;
      width: 80%;
      height: 100vh;
      padding-top: 70px;
      transition: left 0.3s ease;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
      justify-content: flex-start;
      align-items: flex-start;
      z-index: 1000;
    }
    
    .nav-links.active {
      left: 0;
    }
    
    .nav-links li {
      margin: 10px 0;
      width: 100%;
      text-align: left;
    }
    
    .nav-links a {
      display: block;
      padding: 15px 25px;
      width: 100%;
    }
    
    /* Animation cho hamburger menu */
    .hamburger.active span:nth-child(1) {
      transform: translateY(9px) rotate(45deg);
    }
    
    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }
    
    .hamburger.active span:nth-child(3) {
      transform: translateY(-9px) rotate(-45deg);
    }
    
    .overlay.active {
      display: block;
    }
    
    /* Điều chỉnh notification popup trên mobile */
    .notification-popup {
      width: 90%;
      right: 5%;
      left: auto;
      top: 60px;
    }
  }
  </style>
</head>
<body>
  <!-- Phần thanh Navbar bắt đầu từ đây -->
   <!-- Để khởi chạy, cả nhà tải file này về và nối vào các địa chỉ mục tương ứng dùng header: .../Thanh_Navigation_khoa/Navigation_Bar_khoa.html hoặc có thêm phần js hoặc css để nối tới file cụ thể nhưng không cần thiết-->
  <nav class="navbar">
        <!-- Hamburger Menu cho Mobile -->
        <div class="hamburger" id="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
    <div class="logo">
      <img src="./ModelViews/Footer/Anh/bit-logo.png" alt="Logo">
    </div>
    <ul class="nav-links" id="navLinks">
      <li><a href="./index.html">TRANG CHỦ</a></li>
      <li><a href="./Homepage_Ve_Nguon.PHP">LỬA DỆT SỬ ĐỎ</a></li>
      <div class="indicator" id="indicator"></div>
    </ul>
    </div>
  </nav>
   <!-- Overlay cho mobile menu -->
   <div class="overlay" id="overlay"></div>
  
  
  <!-- Link JS để chạy thanh bar - đặt ở cuối body để đảm bảo DOM đã load -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
    const navLinks = document.querySelectorAll(".nav-links a");
    const nav = document.querySelector(".nav-links");
    const indicator = document.getElementById("indicator");
      // Thêm phần JS cho mobile
      const hamburger = document.getElementById("hamburger");
      const overlay = document.getElementById("overlay");
      
      // Toggle mobile menu
      if (hamburger) {
        hamburger.addEventListener("click", function() {
          nav.classList.toggle("active");
          hamburger.classList.toggle("active");
          overlay.classList.toggle("active");
          
          // Ngăn cuộn trang khi menu mở
          if (nav.classList.contains("active")) {
            document.body.style.overflow = "hidden";
          } else {
            document.body.style.overflow = "auto";
          }
        });
      }
      
      // Đóng menu khi click vào overlay
      if (overlay) {
        overlay.addEventListener("click", function() {
          nav.classList.remove("active");
          hamburger.classList.remove("active");
          overlay.classList.remove("active");
          document.body.style.overflow = "auto";
        });
      }
      
      // Đóng menu khi click vào link
      navLinks.forEach(link => {
        link.addEventListener("click", function() {
          if (window.innerWidth <= 768) {
            nav.classList.remove("active");
            hamburger.classList.remove("active");
            overlay.classList.remove("active");
            document.body.style.overflow = "auto";
          }
        });
      });
    // Xử lý phần notification popup
    const bellIcon = document.querySelector(".notification-icon");
    const notificationPopup = document.querySelector(".notification-popup");
  
    // Kiểm tra xem các phần tử có tồn tại không
    if (bellIcon && notificationPopup) {
      // Lắng nghe sự kiện click trên chuông thông báo
      bellIcon.addEventListener("click", function (event) {
        event.stopPropagation();
        
        // Hiển thị/ẩn popup bằng cách trực tiếp thay đổi style
        if (notificationPopup.style.display === "block") {
          notificationPopup.style.display = "none";
        } else {
          notificationPopup.style.display = "block";
        }
      });
  
      // Đóng popup khi click bên ngoài
      document.addEventListener("click", function (event) {
        if (!notificationPopup.contains(event.target) && !bellIcon.contains(event.target)) {
          notificationPopup.style.display = "none";
        }
      });
    } else {
      console.error("Không tìm thấy phần tử notification-icon hoặc notification-popup");
    }
  });
  // Chiều cao của thanh xanh ứng với Thanh Navbar
  window.addEventListener("load", adjustNavLinks);
  window.addEventListener("resize", adjustNavLinks);
  
  function adjustNavLinks() {
    const navbar = document.querySelector(".navbar");
    const links = document.querySelectorAll(".nav-links a::after");
  
    if (navbar) {
      const navbarHeight = navbar.offsetHeight; // Lấy chiều cao navbar
      links.forEach(link => {
        link.style.height = `${navbarHeight}px`; // Cập nhật chiều cao
      });
    }
  }
  
  </script>
</body>
</html>
