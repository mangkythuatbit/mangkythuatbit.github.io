<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — BIT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
/* ===== Design tokens (từ root.css) ===== */
:root{--color-blue-100:#D2E4F1;--color-blue-300:#7FAED2;--color-blue-500:#367CB3;--color-blue-600:#2E6996;--color-blue-700:#24537A;
--color-dark-50:#F3F1F2;--color-dark-100:#E4E0E1;--color-dark-300:#A69FA2;--color-dark-500:#4F464B;--color-dark-700:#332D30;--color-dark-900:#1F1B1D;
--primary-color:var(--color-blue-500);--primary-hover:var(--color-blue-600);--primary-color-2:#EAF2F8;--bg-color:#fff;--text-color:var(--color-dark-500);--text-muted:var(--color-dark-300);
--color-surface:#fff;--color-bg-alt:var(--color-dark-50);--color-border:var(--color-dark-100);--color-text-on-primary:#fff;--error-color:#dc3545;
--font-family-base:'Roboto',sans-serif;--fw-medium:500;--fw-bold:700;--font-size-h1:36px;--line-height-h1:1.3;--font-size-body:16px;--line-height-body:1.5;--font-size-button:16px;
--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;--space-9:96px;
--container-max:1200px;--container-pad:var(--space-5);--radius-sm:8px;--radius-lg:24px;--radius-xl:32px;--radius-pill:999px;--radius-button:8px;--radius-card:16px;
--shadow-md:0 8px 24px rgba(31,27,29,.12);--shadow-lg:0 20px 48px rgba(31,27,29,.16);--shadow-header:0 4px 20px rgba(31,27,29,.08);--shadow-focus:0 0 0 4px var(--color-blue-100);
--transition-base:200ms ease;--button-height:44px;--gap-col-cards:24px;--spacing-section-y:80px;
--font-size-h1-mobile:28px;--font-size-h2-mobile:20px;--font-size-body-mobile:15px;--gap-col-mobile:16px;
--gradient-primary:linear-gradient(135deg,var(--color-blue-500) 0%,var(--color-blue-700) 100%);
--gradient-hero:radial-gradient(120% 140% at 15% 0%,rgba(54,124,179,.55) 0%,rgba(31,27,29,0) 55%),linear-gradient(150deg,var(--color-dark-900) 10%,var(--color-blue-700) 100%)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font-family-base);font-size:var(--font-size-body);line-height:var(--line-height-body);color:var(--text-color);background:var(--bg-color)}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--shadow-focus)}
.container{max-width:var(--container-max);margin:0 auto;padding:0 var(--container-pad)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--button-height);padding:10px var(--space-6);border:0;border-radius:var(--radius-button);background:var(--primary-color);color:var(--color-text-on-primary);font-size:var(--font-size-button);font-weight:var(--fw-bold);transition:background var(--transition-base)}
.btn:hover{background:var(--primary-hover)}.btn:disabled{opacity:.5;cursor:not-allowed}
.logo{font-size:32px;font-weight:var(--fw-bold);font-style:italic;letter-spacing:-1px;color:var(--color-dark-500);line-height:1}.logo i{color:var(--primary-color)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
body{min-height:100vh;display:grid;place-items:center;padding:var(--space-5);background:var(--gradient-hero)}
.card{width:min(420px,100%);padding:var(--space-7) var(--space-6);background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)}
.brand{display:inline-flex;align-items:center}.brand__logo{height:40px;width:auto}.brand__logo--lg{height:56px;margin:0 auto}
.card .brand__logo{margin-bottom:var(--space-4)}
.card h1{text-align:center;font-size:24px;line-height:1.3;color:var(--color-dark-900)}
.card .sub{text-align:center;margin:var(--space-2) 0 var(--space-5);font-size:14px;color:var(--text-muted)}
.field{display:block;margin-bottom:var(--space-4);font-size:14px;font-weight:var(--fw-medium)}
.field input{display:block;width:100%;margin-top:var(--space-1);height:var(--button-height);padding:0 var(--space-3);font:inherit;color:var(--text-color);border:1px solid var(--color-dark-300);border-radius:var(--radius-sm);background:#fff}
.field input:focus{outline:none;border-color:var(--primary-color);box-shadow:var(--shadow-focus)}
.card .btn{width:100%;margin-top:var(--space-2)}
.msg{min-height:20px;margin-top:var(--space-3);font-size:14px;text-align:center;color:var(--error-color)}.msg.ok{color:var(--color-blue-700)}
.back{display:block;margin-top:var(--space-4);text-align:center;font-size:14px;color:var(--primary-color)}.back:hover{text-decoration:underline}
</style>
</head>
<body>
<main class="card">
  <img class="brand__logo brand__logo--lg" src="assets/bit-logo.png" alt="Logo BIT">
  <h1>Đăng nhập</h1>
  <p class="sub">Dùng tài khoản do Đoàn - Hội khoa BIT cấp</p>
  <form id="f" novalidate>
    <label class="field">Email<input id="email" type="email" autocomplete="username" placeholder="mssv@st.ueh.edu.vn" required></label>
    <label class="field">Mật khẩu<input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="btn" id="go" type="submit">Đăng nhập</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
  <a class="back" href="./bit-home.html">← Về trang chủ</a>
</main>
<script>
const CFG = { API: 'https://script.google.com/macros/s/AKfycby1IHduGtQ7wtcxRXCo43WCRbnHpFgjLoDurq1vfDB5Kpm6_9BiqfkvzQ6aJ5gB8rk/exec', HOME: './index.html' };   // cùng URL với trang chủ
const KEY = 'bit_session', $ = id => document.getElementById(id);
const next = (() => { const n = new URLSearchParams(location.search).get('next') || CFG.HOME; return /^[\w./-]+\.html$/.test(n) ? n : CFG.HOME; })();
if (localStorage.getItem(KEY)) location.replace(next);
function msg(t, ok) { $('msg').textContent = t; $('msg').classList.toggle('ok', !!ok); }
$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('email').value.trim(), password = $('pw').value;
  if (!email || !password) return msg('Nhập email và mật khẩu.');
  if (CFG.API.startsWith('PASTE_')) return msg('Chưa cấu hình Apps Script (CFG.API).');
  $('go').disabled = true; msg('Đang đăng nhập...', true);
  try {
    const r = await (await fetch(CFG.API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'login', email, password }) })).json();
    if (!r.ok) throw new Error(r.error || 'Đăng nhập thất bại');
    localStorage.setItem(KEY, JSON.stringify({ token: r.token, name: r.name, email: r.email }));
    location.replace(next);
  } catch (err) { msg(err.message); $('go').disabled = false; }
});
</script>
</body>
</html>
