<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — BIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
:root{--color-blue-100:#D2E4F1;--color-blue-300:#7FAED2;--color-blue-500:#367CB3;--color-blue-600:#2E6996;--color-blue-700:#24537A;
--color-dark-50:#F3F1F2;--color-dark-100:#E4E0E1;--color-dark-300:#A69FA2;--color-dark-500:#4F464B;--color-dark-700:#332D30;--color-dark-900:#1F1B1D;
--primary-color:var(--color-blue-500);--primary-hover:var(--color-blue-600);--primary-color-2:#EAF2F8;--bg-color:#fff;--text-color:var(--color-dark-500);--text-muted:#7d7579;
--color-surface:#fff;--color-bg-alt:var(--color-dark-50);--color-text-on-primary:#fff;--error-color:#dc3545;
--font-family-base:'Roboto',sans-serif;--fw-medium:500;--fw-bold:700;--font-size-h1:36px;--line-height-h1:1.3;--font-size-body:16px;--line-height-body:1.5;
--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;--space-9:96px;
--container-max:1200px;--container-pad:var(--space-5);--radius-sm:8px;--radius-lg:24px;--radius-xl:32px;--radius-pill:999px;--radius-button:8px;--radius-card:16px;
--shadow-md:0 8px 24px rgba(31,27,29,.12);--shadow-lg:0 20px 48px rgba(31,27,29,.16);--shadow-header:0 4px 20px rgba(31,27,29,.08);--shadow-focus:0 0 0 4px var(--color-blue-100);
--transition-base:200ms ease;--button-height:44px;--gap-col-cards:24px;--spacing-section-y:80px;
--font-size-h1-mobile:28px;--font-size-h2-mobile:20px;--font-size-body-mobile:15px;--gap-col-mobile:16px;
--gradient-primary:linear-gradient(135deg,var(--color-blue-500) 0%,var(--color-blue-700) 100%);
--gradient-hero:radial-gradient(120% 140% at 15% 0%,rgba(54,124,179,.55) 0%,rgba(31,27,29,0) 55%),linear-gradient(150deg,var(--color-dark-900) 10%,var(--color-blue-700) 100%)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font-family-base);font-size:var(--font-size-body);line-height:var(--line-height-body);color:var(--text-color);background:var(--bg-color)}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}h1,h2,h3,h4,p,ul{margin:0}ul{padding:0;list-style:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--shadow-focus)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:var(--button-height);padding:10px var(--space-6);border:0;border-radius:var(--radius-button);background:var(--primary-color);color:#fff;font-size:16px;font-weight:var(--fw-bold);transition:background var(--transition-base)}
.btn:hover{background:var(--primary-hover)}.btn:disabled{opacity:.6;cursor:not-allowed}
.brand{display:inline-flex;align-items:center}.brand__logo{height:40px;width:auto}.brand__logo--lg{height:56px;margin:0 auto}
.logo-fallback{font-size:28px;font-weight:var(--fw-bold);font-style:italic;color:var(--primary-color)}
.soc{display:flex;gap:var(--space-3)}.soc a{display:grid;place-items:center;width:38px;height:38px;border-radius:var(--radius-pill);background:var(--primary-color);color:#fff;font-size:16px;transition:background var(--transition-base),transform var(--transition-base)}
.soc a:hover{background:var(--color-blue-700);transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--gradient-hero);color:#fff}
.top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);max-width:var(--container-max);width:100%;margin:0 auto;padding:var(--space-4) var(--container-pad)}
.top .brand{padding:var(--space-2) var(--space-4);border-radius:var(--radius-sm);background:#fff}
.top__back{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-radius:var(--radius-pill);font-size:14px;font-weight:var(--fw-medium);color:#fff;border:1px solid rgba(255,255,255,.4);transition:background var(--transition-base)}.top__back:hover{background:rgba(255,255,255,.12)}
.auth{flex:1;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:var(--space-8);max-width:var(--container-max);width:100%;margin:0 auto;padding:var(--space-6) var(--container-pad)}
.welcome h1{font-size:44px;line-height:1.25;font-weight:var(--fw-bold)}.welcome h1 em{font-style:normal;color:var(--color-blue-300)}
.welcome p{margin-top:var(--space-4);max-width:420px;font-size:18px;color:var(--color-blue-100)}
.card{width:min(440px,100%);justify-self:end;padding:var(--space-7) var(--space-6);background:#fff;color:var(--text-color);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)}
.card h2{font-size:24px;line-height:1.3;color:var(--color-dark-900)}.card .sub{margin:var(--space-1) 0 var(--space-5);font-size:14px;color:var(--text-muted)}
.field{margin-bottom:var(--space-4)}.field label{display:block;margin-bottom:var(--space-1);font-size:14px;font-weight:var(--fw-medium);color:var(--color-dark-900)}
.input{position:relative;display:flex;align-items:center}
.input>i.lead{position:absolute;left:var(--space-4);color:var(--color-dark-300);pointer-events:none}
.input input{width:100%;height:48px;padding:0 48px 0 44px;font:inherit;color:var(--text-color);border:1px solid var(--color-dark-300);border-radius:var(--radius-sm);background:#fff;transition:border-color var(--transition-base),box-shadow var(--transition-base)}
.input input:focus{outline:none;border-color:var(--primary-color);box-shadow:var(--shadow-focus)}.input input.is-bad{border-color:var(--error-color)}
.input .act{position:absolute;right:var(--space-2);width:36px;height:36px;border:0;background:none;border-radius:var(--radius-pill);color:var(--color-dark-300);font-size:16px}.input .act:hover{color:var(--primary-color);background:var(--primary-color-2)}.input .act[hidden]{display:none}
.row{display:flex;justify-content:flex-end;margin:calc(-1*var(--space-1)) 0 var(--space-4)}.row a{font-size:14px;color:var(--primary-color)}.row a:hover{text-decoration:underline}
.card .btn{width:100%;height:48px}
.msg{display:flex;gap:var(--space-2);align-items:flex-start;margin-top:var(--space-3);font-size:14px;color:var(--error-color)}.msg:empty{display:none}.msg.ok{color:var(--color-blue-700)}
.mini{display:flex;flex-direction:column;align-items:center;gap:var(--space-3);padding:var(--space-5) var(--container-pad);font-size:13px;color:var(--color-blue-100)}
.mini .soc a{background:rgba(255,255,255,.16)}.mini .soc a:hover{background:var(--primary-color)}
@media (max-width:900px){.auth{grid-template-columns:1fr;gap:var(--space-5);text-align:center}.welcome h1{font-size:var(--font-size-h1-mobile)}.welcome p{margin-inline:auto;font-size:16px}.card{justify-self:center;padding:var(--space-6) var(--space-5)}}
</style>
</head>
<body>
<header class="top">
  <a href="./index.html" class="brand" aria-label="Trang chủ BIT"><img class="brand__logo" data-logo="head" alt="Logo BIT"></a>
  <a href="./index.html" class="top__back"><i class="fa-solid fa-arrow-left"></i>Về trang chủ</a>
</header>
<main class="auth">
  <section class="welcome">
    <h1>CHÀO MỪNG <em>BIT-ER</em> TRỞ LẠI</h1>
    <p>Đăng nhập để thích chương trình, bình luận và theo dõi hoạt động của Đoàn - Hội khoa BIT.</p>
  </section>
  <section class="card" aria-labelledby="t">
    <h2 id="t">Đăng nhập</h2>
    <p class="sub">Dùng tài khoản do Đoàn - Hội khoa BIT cấp</p>
    <form id="f" novalidate>
      <div class="field"><label for="email">Email</label>
        <div class="input"><i class="fa-regular fa-envelope lead" aria-hidden="true"></i>
          <input id="email" type="email" autocomplete="username" placeholder="mssv@st.ueh.edu.vn" required>
          <button type="button" class="act" id="clear" aria-label="Xóa email" hidden><i class="fa-regular fa-circle-xmark"></i></button></div></div>
      <div class="field"><label for="pw">Mật khẩu</label>
        <div class="input"><i class="fa-solid fa-lock lead" aria-hidden="true"></i>
          <input id="pw" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>
          <button type="button" class="act" id="eye" aria-label="Hiện mật khẩu" aria-pressed="false"><i class="fa-regular fa-eye"></i></button></div></div>
      <div class="row"><a href="mailto:doanhoi.bit@ueh.edu.vn?subject=Quên mật khẩu cổng BIT">Quên mật khẩu?</a></div>
      <button class="btn" id="go" type="submit">ĐĂNG NHẬP</button>
      <p class="msg" id="msg" role="alert"></p>
    </form>
  </section>
</main>
<footer class="mini">
  <div class="soc">
    <a href="https://www.facebook.com/groups/1129624948171351" target="_blank" rel="noopener" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
    <a href="#" target="_blank" rel="noopener" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
    <a href="mailto:doanhoi.bit@ueh.edu.vn" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
    <a href="#" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
  </div>
  <p>© 2026 Đoàn TN – Hội SV khoa Công nghệ thông tin kinh doanh (BIT), UEH</p>
</footer>

document.querySelectorAll('img[data-logo]').forEach(im => { im.src = LOGO[im.dataset.logo] || LOGO.head; });
const CFG = { API: 'https://script.google.com/macros/s/AKfycby1IHduGtQ7wtcxRXCo43WCRbnHpFgjLoDurq1vfDB5Kpm6_9BiqfkvzQ6aJ5gB8rk/exec', HOME: './index.html' };
const KEY = 'bit_session', $ = id => document.getElementById(id);
const next = (() => { const n = new URLSearchParams(location.search).get('next') || CFG.HOME; return /^[\w./-]+\.html$/.test(n) ? n : CFG.HOME; })();
if (localStorage.getItem(KEY)) location.replace(next);
function msg(t, ok) { const m = $('msg'); m.innerHTML = t ? `<i class="fa-solid ${ok ? 'fa-spinner fa-spin' : 'fa-circle-exclamation'}" aria-hidden="true" style="margin-top:3px"></i><span></span>` : ''; if (t) m.lastChild.textContent = t; m.classList.toggle('ok', !!ok); }
const sync = () => { $('clear').hidden = !$('email').value; };
$('email').addEventListener('input', () => { sync(); $('email').classList.remove('is-bad'); });
$('pw').addEventListener('input', () => $('pw').classList.remove('is-bad'));
$('clear').onclick = () => { $('email').value = ''; sync(); $('email').focus(); };
$('eye').onclick = () => {
  const show = $('pw').type === 'password'; $('pw').type = show ? 'text' : 'password';
  $('eye').setAttribute('aria-pressed', show); $('eye').setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
  $('eye').firstElementChild.className = show ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
};
$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('email').value.trim(), password = $('pw').value;
  if (!email || !/^\S+@\S+\.\S+$/.test(email)) { $('email').classList.add('is-bad'); $('email').focus(); return msg('Nhập đúng định dạng email.'); }
  if (!password) { $('pw').classList.add('is-bad'); $('pw').focus(); return msg('Nhập mật khẩu.'); }
  if (CFG.API.startsWith('PASTE_')) return msg('Chưa cấu hình Apps Script (CFG.API).');
  $('go').disabled = true; msg('Đang đăng nhập...', true);
  try {
    const r = await (await fetch(CFG.API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'login', email, password }) })).json();
    if (!r.ok) throw new Error(r.error || 'Đăng nhập thất bại');
    localStorage.setItem(KEY, JSON.stringify({ token: r.token, name: r.name, email: r.email }));
    location.replace(next);
  } catch (err) { msg(err.message); $('go').disabled = false; }
});
</script>
</body>
</html>
